# nginx site for Our Places. Install as /etc/nginx/sites-available/our-places and
# link it into sites-enabled. It answers only for its own hostname, so other sites
# on the server are unaffected. Replace SERVER-IP-WITH-DASHES, e.g. 203-0-113-7.
# certbot --nginx adds the HTTPS server block and the redirect afterwards.
server {
    listen 80;
    listen [::]:80;
    server_name ourplaces.SERVER-IP-WITH-DASHES.sslip.io;

    # Photos are up to 8 MB each.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
